# Builds an installable Android preview (APK) on GitHub's computers.
# Run it from the repo's "Actions" tab → "Android preview APK" → "Run workflow",
# or it runs by itself on every push to main. Download the APK from the run page.
#
# Repository secrets it uses (Settings → Secrets and variables → Actions):
#   FIREBASE_PROJECT_ID        your Firebase project id
#   FIREBASE_SERVICE_ACCOUNT   JSON key of a Firebase service account (README: "Install a preview")
#   MAPS_API_KEY               Google Maps key (optional; the map is blank without it)
#   ANDROID_KEYSTORE_BASE64    optional; created for you on the first run, see README
#   ANDROID_KEYSTORE_PASSWORD  optional; defaults to letea-preview
name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backend:
    name: Deploy database rules and server functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$SA_JSON" ]; then
            echo "::warning::Firebase secrets not added yet, so the backend was not deployed (README: Install a preview)."
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm install -g firebase-tools
          (cd functions && npm install)
          firebase deploy --only firestore,storage,functions --project "$PROJECT_ID" --non-interactive --force

  apk:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          if [ ! -d android ]; then
            flutter create . --org com.letea --project-name letea --platforms android
            rm -f test/widget_test.dart
          fi
          flutter pub get

      - name: Connect the app to Firebase
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if grep -q "PLACEHOLDER" lib/firebase_options.dart; then
            if [ -z "$PROJECT_ID" ] || [ -z "$SA_JSON" ]; then
              echo "::warning::Firebase secrets not added yet. Building in PREVIEW MODE: the app runs with sample data on the phone. Add the secrets to connect your real database (README: Install a preview)."
              exit 0
            fi
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
            npm install -g firebase-tools
            dart pub global activate flutterfire_cli
            export PATH="$PATH:$HOME/.pub-cache/bin"
            flutterfire configure --project="$PROJECT_ID" --platforms=android \
              --android-package-name=com.letea.letea --yes
          else
            echo "Firebase already configured in the repo; skipping."
          fi

      - name: Add permissions, Maps key and minimum Android version
        run: python3 tool/ci_patch_android.py "${{ secrets.MAPS_API_KEY }}"

      - name: Check the code
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings lib > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            # One annotation with every error, so it can be read from the run page and the API.
            msg=$(grep -E "^\s*error " analyze.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Code errors::${msg}"
            exit 1
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Sign with a stable key (keeps phone login working between builds)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          PASS="${KS_PASS:-letea-preview}"
          mkdir -p out
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/letea.jks"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/letea.jks" -alias letea \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Letea Preview, O=Letea, C=TZ"
            base64 -w0 "$RUNNER_TEMP/letea.jks" > out/SAVE-AS-ANDROID_KEYSTORE_BASE64-secret.txt
            echo "::warning::New signing key created. Save it as the ANDROID_KEYSTORE_BASE64 secret (file in the download) so future builds keep the same fingerprints."
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/letea.jks" --ks-pass "pass:$PASS" --ks-key-alias letea \
            --out out/letea-preview.apk build/app/outputs/flutter-apk/app-release.apk
          keytool -list -v -keystore "$RUNNER_TEMP/letea.jks" -alias letea -storepass "$PASS" \
            | grep -E "SHA1:|SHA256:" > out/fingerprints-add-to-firebase.txt
          cat out/fingerprints-add-to-firebase.txt

      - uses: actions/upload-artifact@v4
        with:
          name: letea-android-preview
          path: out/
          retention-days: 30
