# Builds an installable Android APK of the Jaza app on every push to the jaza-app branch
# (or by hand from the Actions tab), then publishes it as the "jaza-preview" release.
# Download it on your phone from: https://github.com/<you>/<repo>/releases/tag/jaza-preview
name: Android APK

on:
  push:
    branches: [jaza-app]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jaza-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package.json', 'mobile/app.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install packages
        run: npm run setup

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'http://192.168.1.20:4000' }}

      - name: Build APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL || 'http://192.168.1.20:4000' }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk ../out/jaza-preview.apk
          ls -lh ../out

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v4
        with:
          name: jaza-preview-apk
          path: out/jaza-preview.apk

      - name: Publish as the "jaza-preview" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jaza-preview --yes --cleanup-tag || true
          gh release create jaza-preview out/jaza-preview.apk \
            --target "$GITHUB_SHA" \
            --title "Jaza preview build" \
            --notes "Android preview built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Download jaza-preview.apk on your phone and install it. Set the server address in the app under Server settings." \
            --prerelease
