name: letea
description: Letea - shopping, medicine, food and home services delivered in Dar es Salaam.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
